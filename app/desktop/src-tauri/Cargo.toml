# Workspace próprio: depende das bibliotecas do sistema (WebView) e não deve
# entrar no `cargo build --workspace` de app/ (DT-0004).
[workspace]

[package]
name = "desvtag-desktop"
description = "Aplicativo Windows do DesvTAG (Tauri)"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/VitorMazziero/desvtag"
authors = ["DesvTAG contributors"]

[lib]
name = "desvtag_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }
opener = "0.8"
desvtag-engine = { path = "../../crates/desvtag-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[features]
# Só para a verificação automatizada (nunca no instalador): `export_file` grava na pasta de
# `ENZITAG_EXPORT_DIR` em vez de abrir o diálogo nativo, que não é automatizável.
automation = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
