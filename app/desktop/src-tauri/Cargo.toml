# Workspace próprio: depende das bibliotecas do sistema (WebView) e não deve
# entrar no `cargo build --workspace` de app/ (DT-0004).
[workspace]

[package]
name = "optima-desktop"
description = "Aplicativo Windows do EnziTAG Optima (Tauri)"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/VitorMazziero/enzitag-optima"
authors = ["EnziTAG Optima contributors"]

[lib]
name = "optima_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
optima-engine = { path = "../../crates/optima-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
